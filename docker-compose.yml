version: '3.8'

services:
  app:
    build: .
    ports:
      - "9000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      - mongo
    environment:
      - OAUTHLIB_INSECURE_TRANSPORT=1

  mongo:
    image: mongo:7
    ports:
      - "27037:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
