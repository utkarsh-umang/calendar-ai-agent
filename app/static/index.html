<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="icon" type="image/png" href="favicon.png" />
  <title>Calendar Agent</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Login ── */
    #login-view {
      text-align: center;
      background: white;
      padding: 48px 40px;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      width: 360px;
    }

    #login-view h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #111;
    }

    #login-view p {
      color: #666;
      font-size: 14px;
      margin-bottom: 32px;
    }

    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 12px;
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 500;
      color: #333;
      cursor: pointer;
      transition: background 0.15s;
      text-decoration: none;
    }

    .google-btn:hover { background: #f9f9f9; }

    .google-btn svg { width: 20px; height: 20px; }

    /* ── Chat ── */
    #chat-view {
      display: none;
      flex-direction: column;
      width: 720px;
      height: 90vh;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
      overflow: hidden;
    }

    #chat-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #eee;
    }

    #chat-header .title {
      font-size: 16px;
      font-weight: 600;
      color: #111;
    }

    #user-info {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: #555;
    }

    #user-info img {
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    #logout-btn {
      font-size: 13px;
      color: #888;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    #logout-btn:hover { background: #f5f5f5; color: #333; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.user {
      align-self: flex-end;
      background: #111;
      color: white;
      border-bottom-right-radius: 2px;
    }

    .message.agent {
      align-self: flex-start;
      background: #f0f0f0;
      color: #111;
      border-bottom-left-radius: 2px;
    }

    .message.agent.loading {
      color: #888;
      font-style: italic;
    }

    #input-area {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #eee;
    }

    #msg-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    #msg-input:focus { border-color: #111; }

    #send-btn {
      padding: 10px 20px;
      background: #111;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #send-btn:hover { background: #333; }
    #send-btn:disabled { background: #ccc; cursor: not-allowed; }
  </style>
</head>
<body>

  <!-- Login view -->
  <div id="login-view">
    <h1>Calendar Agent</h1>
    <p>Your AI-powered executive assistant for Google Calendar</p>
    <a href="/auth/login" class="google-btn">
      <svg viewBox="0 0 48 48">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
      </svg>
      Continue with Google
    </a>
  </div>

  <!-- Chat view -->
  <div id="chat-view">
    <div id="chat-header">
      <span class="title">Calendar Agent</span>
      <div style="display:flex;align-items:center;gap:12px">
        <div id="user-info"></div>
        <button id="logout-btn" onclick="window.location='/auth/logout'">Logout</button>
      </div>
    </div>
    <div id="messages">
      <div class="message agent">
        Hi! I'm your calendar assistant. Ask me to list, create, update or delete events.
      </div>
    </div>
    <div id="input-area">
      <input
        id="msg-input"
        type="text"
        placeholder="e.g. What's on my calendar tomorrow?"
        autocomplete="off"
      />
      <button id="send-btn" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let sessionId = crypto.randomUUID();

    async function checkAuth() {
      const res = await fetch('/auth/me', { credentials: 'include' });
      const data = await res.json();

      if (data.authenticated) {
        document.getElementById('login-view').style.display = 'none';
        document.getElementById('chat-view').style.display = 'flex';
        document.getElementById('user-info').innerHTML = `
          ${data.picture ? `<img src="/auth/avatar" alt="avatar"/>` : ''}
          <span>${data.name || data.email}</span>
        `;
      } else {
        document.getElementById('login-view').style.display = 'block';
        document.getElementById('chat-view').style.display = 'none';
      }
    }

    async function sendMessage() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      input.value = '';

      const sendBtn = document.getElementById('send-btn');
      sendBtn.disabled = true;

      const loadingEl = appendMessage('Thinking...', 'agent loading');

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ message: text, session_id: sessionId }),
        });

        const data = await res.json();
        loadingEl.remove();
        appendMessage(data.response || data.error, 'agent');
      } catch (err) {
        loadingEl.remove();
        appendMessage('Something went wrong. Please try again.', 'agent');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    function appendMessage(text, className) {
      const messages = document.getElementById('messages');
      const el = document.createElement('div');
      el.className = `message ${className}`;
      el.textContent = text;
      messages.appendChild(el);
      messages.scrollTop = messages.scrollHeight;
      return el;
    }

    document.getElementById('msg-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') sendMessage();
    });

    checkAuth();
  </script>

</body>
</html>
